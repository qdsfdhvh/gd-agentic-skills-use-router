name: Update GD Agentic Skills
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-gd-agentic-skills
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update pinned upstream revision
        run: |
          git -C upstream/gd-agentic-skills fetch --tags --prune origin main
          git -C upstream/gd-agentic-skills checkout --detach origin/main
      - run: npm run generate && npm run validate && npm test
      - name: Commit generated update
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add skills/ upstream/gd-agentic-skills
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          REV=$(git -C upstream/gd-agentic-skills rev-parse --short HEAD)
          git commit -m "chore: update GD Agentic Skills to $REV"
          git push origin "HEAD:$DEFAULT_BRANCH"
